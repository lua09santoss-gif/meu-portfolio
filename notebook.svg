<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Notebook com símbolo de código na tela" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tela" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5BD6"/>
      <stop offset="1" stop-color="#3A2680"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6E0F5"/>
      <stop offset="1" stop-color="#C9BFE8"/>
    </linearGradient>
  </defs>

  <!-- formas de fundo -->
  <path d="M95 240 C45 170 105 55 225 48 C335 30 465 45 520 130 C575 215 540 340 430 372 C320 404 150 350 95 240 Z" fill="#E4DBFA"/>
  <path d="M150 300 C110 250 170 130 270 120 C370 110 470 150 490 230 C510 310 420 360 320 360 C240 360 185 345 150 300 Z" fill="#D2C4F6" opacity="0.7"/>

  <!-- detalhes decorativos -->
  <circle cx="92" cy="120" r="7" fill="#B9A6EE"/>
  <circle cx="520" cy="86" r="5" fill="#B9A6EE"/>
  <circle cx="545" cy="300" r="8" fill="#CBBDF3"/>
  <path d="M70 330 h16 M78 322 v16" stroke="#9D86E6" stroke-width="3" stroke-linecap="round"/>
  <path d="M500 380 h14 M507 373 v14" stroke="#9D86E6" stroke-width="3" stroke-linecap="round"/>

  <!-- sombra -->
  <ellipse cx="300" cy="332" rx="215" ry="14" fill="#2B1D57" opacity="0.12"/>

  <!-- tampa / tela -->
  <rect x="145" y="85" width="310" height="200" rx="16" fill="#2B1D57"/>
  <rect x="158" y="98" width="284" height="174" rx="8" fill="url(#tela)"/>
  <circle cx="300" cy="92" r="2.5" fill="#6A58A8"/>

  <!-- símbolo de código -->
  <g fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 160 L238 185 L268 210"/>
    <path d="M332 160 L362 185 L332 210"/>
    <path d="M311 154 L289 216"/>
  </g>

  <!-- linhas de código decorativas -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round">
    <path d="M180 120 h46"/>
    <path d="M374 244 h46"/>
    <path d="M180 244 h30"/>
  </g>

  <!-- base do notebook -->
  <path d="M110 285 H490 L512 312 Q516 324 502 324 H98 Q84 324 88 312 Z" fill="url(#base)"/>
  <rect x="262" y="285" width="76" height="9" rx="4.5" fill="#B3A7DC"/>
</svg>
